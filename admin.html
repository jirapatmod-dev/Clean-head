<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ — Clean head</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ตารางรายการสั่งซื้อ (style.css กลางยังไม่มีสไตล์ตาราง) */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line-soft);
    }

    #ordersTable {
      width: 100%;
      min-width: 48rem;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    #ordersTable th,
    #ordersTable td {
      text-align: left;
      vertical-align: top;
      padding: var(--space-2) var(--space-3);
    }

    #ordersTable thead th {
      font-weight: 400;
      color: var(--ink-soft);
      background: var(--cream);
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    #ordersTable tbody td {
      border-bottom: 1px solid var(--line-soft);
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    #ordersTable tbody tr:last-child td { border-bottom: 0; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Clean head</a>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <h1>รายการสั่งซื้อ</h1>
          <p>แสดงคำสั่งซื้อล่าสุดก่อน</p>
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร/Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
